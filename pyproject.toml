[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = [
    "main.py",
    "scraper.py",
    "converter.py",
    "merge_md.py",
    "webui.py",
    "tui.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_error_summary = true
